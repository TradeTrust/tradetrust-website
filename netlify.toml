[[redirects]]
  from = "/resources"
  to = "/learn"

[[redirects]]
  from = "/contact"
  to = "https://www.form.gov.sg/635f32c5001b2d0011fff09b"

[context.deploy-preview]
  [[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { Host = ["ref.tradetrust.io", "dev.tradetrust.io"] }

[[redirects]]
  from = "/*"
  to = "data:text/plain;charset=utf-8,400 Bad Request: Invalid Host Header. This domain is not authorized for TradeTrust."
  status = 400
  force = true

[build]
  ignore = "git log -1 --pretty=%B | grep dependabot"

[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy
    # connect-src and frame-src allow any https host: action links load documents from the issuer's own storage,
    # and documents name their own renderer URL. 'unsafe-inline' covers the inline scripts in index.html;
    # 'unsafe-eval' is needed by Ajv in @tradetrust-tt/tradetrust.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://*.magic.link; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://use.fontawesome.com; font-src 'self' data: https://fonts.gstatic.com https://use.fontawesome.com; img-src 'self' blob: data: https:; connect-src 'self' https: wss:; frame-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"
    
    # Permissions Policy - Browser feature access control
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=(), autoplay=(), encrypted-media=(), fullscreen=(self), picture-in-picture=()"
    
    # Cross-origin protection (CORP + COOP for Spectre mitigation)
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    # Cross-Origin-Embedder-Policy omitted - compatibility with Netlify deployment tools

    # Additional security headers
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/images/favicon/favicon-*"
  [headers.values]
    # Allow cross-origin access for favicon files (needed for MetaMask popup)
    Cross-Origin-Resource-Policy = "cross-origin"
